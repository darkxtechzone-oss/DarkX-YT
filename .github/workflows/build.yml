name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleRelease -PverCode=${{ github.run_number }} -PghRepo=${{ github.repository }}
      - run: cp app/build/outputs/apk/release/app-release.apk DarkXYT.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: DarkX YT v${{ github.run_number }}
          files: DarkXYT.apk
          make_latest: true
